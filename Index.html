<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Pintar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div id="menu" class="card">
            <div class="emoji">🎯</div>
            <h1>Kuis Pintar</h1>
            <p>Uji pengetahuanmu dan raih skor tertinggi!</p>
            <button id="startBtn">Mulai Kuis 🚀</button>
        </div>

        <div id="quiz" class="card hidden">
            <p id="questionNumber"></p>
            <div class="progress">
                <div id="progressBar"></div>
            </div>

            <h2 id="question"></h2>
            <div id="options"></div>

            <button id="nextBtn" class="hidden">Berikutnya ➜</button>
        </div>

        <div id="result" class="card hidden">
            <div class="emoji">🏆</div>
            <h1 id="resultTitle"></h1>
            <p id="scoreText"></p>
            <button id="restartBtn">Main Lagi 🔄</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
